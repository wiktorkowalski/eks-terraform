apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-prometheus-stack

resources:
  - namespace.yml
  - application.yml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 69.7.2
    releaseName: prometheus
    namespace: kube-prometheus-stack
    includeCRDs: true
    valuesFile: values.yml
