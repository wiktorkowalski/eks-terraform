# This file is intentionally minimal since ArgoCD defines its own IngressRoute
# in k8s/argocd/base/ingress-route.yaml
# This file exists to satisfy the kustomization but contains no resources
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-ingress-placeholder
  namespace: traefik-system
data:
  note: "ArgoCD IngressRoute is defined in k8s/argocd/base/ingress-route.yaml"
