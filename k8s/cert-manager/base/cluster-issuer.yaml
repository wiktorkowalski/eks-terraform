apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: contact@wiktorkowalski.pl
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          route53:
            region: eu-west-1
            hostedZoneID: ""  # Will be auto-discovered based on domain
        selector:
          dnsZones:
            - "aws.wiktorkowalski.pl"
