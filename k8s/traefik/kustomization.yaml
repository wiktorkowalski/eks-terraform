apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: traefik-system

resources:
  # Traefik CRDs (must be first)
  - base/crds.yaml

  # Base Traefik components
  - base/namespace.yaml
  - base/rbac.yaml
  - base/configmap.yaml
  - base/service.yaml
  - base/daemonset.yaml

  # Middlewares (used across namespaces)
  - config/middleware-secure-headers.yaml
  - config/middleware-redirect-https.yaml
  - config/middleware-rate-limit.yaml
  - config/middleware-compress.yaml
  - config/tls-options.yaml

  # Traefik Dashboard
  - config/traefik-dashboard-ingressroute.yaml

  # IngressRoutes are managed by their respective apps:
  # - ArgoCD IngressRoute: managed by argocd app
  # - Monitoring IngressRoutes: managed by monitoring apps
  # - Dashboard IngressRoute: managed by dashboard app
